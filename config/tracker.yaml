# Multi-Camera 3D Tracker Configuration

# Detection settings
detection:
    model_path: "models/yolov8s.pt"    # small — баланс качества/скорости
    # model_path: "models/yolov8m.pt"  # если хотите максимум качества (влезет в 8GB)
    conf_threshold: 0.15              # lowered to catch distant/oblique views (Cam5: 0.103)
    iou_threshold: 0.45
    imgsz: 640
    device: "cpu"
    half: false              # FP16 — только на GPU
    tracker: "bytetrack"
    tracker_config: "config/bytetrack.yaml"
    classes: [2, 5, 7]                # только транспорт: 2=car, 5=bus, 7=truck
    min_detection_area: 500           # lower to allow smaller distant detections
    batch: 1                # batch size для CPU
triangulation:
    method: "optimal"
    ransac: true
    ransac_threshold_px: 2.0
    min_views: 2
tracker3d:
    motion_model: "CV"
    dt: 0.033
    process_noise: 100.0
    measurement_noise: 50.0
association:
    geometric_weight: 0.6
    appearance_weight: 0.4
    epipolar_threshold_px: 5.0
    appearance_threshold: 0.35
    use_temporal: true
    reid_device: "cpu"   # OSNet на CPU
    reid_model: "models/osnet_x1_0.pth"
visualization:
    enabled: true
    save_video: true
    draw_2d_boxes: true
    draw_3d_reprojection: true
    draw_trajectory_3d: true
    draw_plots: true
    output_dir: "output"
    output_fps: 30

# GT Correction
# GT trajectory tracks truck pivot (rear axle, ground level ~300cm).
# Visual center in image is cabin roof (~350-400cm above ground).
# Add Z-offset to project to visual center for all camera angles.
gt_correction:
    z_offset_cm: 350.0      # поднимем GT точку на 3.5м (cabin roof height)
    apply_to_triangulation: false  # только для валидации/авторазметки
    apply_to_validation: true

# Monocular Depth Estimation (для кадров с 1 камерой)
monocular_depth:
    enabled: true
    min_confidence: 0.3
    max_z_cm: 20000.0
    min_z_cm: 500.0
    truck_height_cm: 350.0
    truck_width_cm: 250.0
    truck_length_cm: 650.0
pipeline:
    mode: "sync"            # на GPU детектор быстрый, async не нужен
    max_frames: -1