# Multi-Camera 3D Tracker Configuration

# Detection settings
detection:
    model_path: "models/yolov8s.pt"    # small — баланс качества/скорости
    # model_path: "models/yolov8m.pt"  # если хотите максимум качества (влезет в 8GB)
    conf_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    device: "cuda:0"
    half: true              # FP16 — на 2070 Super даёт ~1.7x ускорение
    tracker: "bytetrack"
    tracker_config: "config/bytetrack.yaml"
    classes: null               # например [0, 2] — только person/car; null = все классы
    min_detection_area: 0       # минимальная площадь бокса в px², чтобы отсекать мелкий шум/далекие объекта
    batch: 4                # 4 кадра за раз — ускоряет загрузку GPU
triangulation:
    method: "optimal"
    ransac: true
    ransac_threshold_px: 2.0
    min_views: 2
tracker3d:
    motion_model: "CV"
    dt: 0.033
    process_noise: 100.0
    measurement_noise: 50.0
association:
    geometric_weight: 0.6
    appearance_weight: 0.4
    epipolar_threshold_px: 5.0
    appearance_threshold: 0.35
    use_temporal: true
    reid_device: "cuda:0"   # OSNet на GPU
    reid_model: "models/osnet_x1_0.pth"
visualization:
    enabled: true
    save_video: true
    draw_2d_boxes: true
    draw_3d_reprojection: true
    draw_trajectory_3d: true
    draw_plots: true
    output_dir: "output"
    output_fps: 30
pipeline:
    mode: "sync"            # на GPU детектор быстрый, async не нужен
    max_frames: -1